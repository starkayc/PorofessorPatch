name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Smoke test the built exe
        run: .\dist\PorofessorPatch.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: PorofessorPatch
          path: dist/PorofessorPatch.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PorofessorPatch.exe
            dist/PorofessorPatch.exe.sha256
          generate_release_notes: true
