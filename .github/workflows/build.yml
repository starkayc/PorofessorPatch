name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/PorofessorPatch/PorofessorPatch.csproj -c Release

      - name: Smoke test the built exe
        run: .\src\PorofessorPatch\bin\Release\net48\PorofessorPatch.exe --version

      - name: Write sha256 checksum
        run: |
          $h = (Get-FileHash 'src\PorofessorPatch\bin\Release\net48\PorofessorPatch.exe' -Algorithm SHA256).Hash.ToLower()
          "$h  PorofessorPatch.exe" | Out-File -Encoding ascii 'src\PorofessorPatch\bin\Release\net48\PorofessorPatch.exe.sha256'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PorofessorPatch
          path: src/PorofessorPatch/bin/Release/net48/PorofessorPatch.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            src/PorofessorPatch/bin/Release/net48/PorofessorPatch.exe
            src/PorofessorPatch/bin/Release/net48/PorofessorPatch.exe.sha256
          generate_release_notes: true
